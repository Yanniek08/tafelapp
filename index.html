<!doctype html>
<html lang="nl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tafel App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body style="background-color: lightblue;">

    <div class="container mt-5">
        <div class="row">

            <!-- Kaart links -->
            <div class="col-md-4">
                <div class="card">

                    <div class="card-header">
                        Tafel van ...
                    </div>

                    <div class="card-body">

                        <div class="row g-3 align-items-center mb-3">

                            <div class="col">
                                <label for="inputTafel" class="col-form-label">
                                    Welke tafel moet je?
                                </label>
                            </div>

                            <div class="col">
                                <input type="number" id="inputTafel"
                                    class="form-control">
                            </div>

                            <div class="col">
                                <button class="btn btn-success"
                                    onclick="showTafel()">
                                    GO!
                                </button>
                            </div>

                        </div>

                        <p class="card-text" id="outputTafel">
                            Vul een getal in en klik op GO!
                        </p>

                    </div>

                    <div class="card-footer text-body-secondary">
                        Made by Yanniek
                    </div>

                </div>
            </div>

            <!-- Lege ruimte -->
            <div class="col-md-2"></div>

            <!-- Kaart midden -->
            <div class="col-md-4">
                <div class="card">

                    <div class="card-header">
                        Oefenen
                    </div>

                    <div class="card-body">

                        <p id="som"></p>

                        <input type="number" id="antwoord"
                            class="form-control mb-3"
                            placeholder="Jouw antwoord">

                        <button class="btn btn-primary"
                            onclick="controleerAntwoord()">
                            Controleer
                        </button>

                        <p class="mt-3" id="resultaat"></p>

                    </div>

                    <div class="card-footer text-body-secondary">
                        Oefen je tafels
                    </div>

                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="tafelapp.js"></script>

</body>

</html>
